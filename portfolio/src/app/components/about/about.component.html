<section id="sobre-mi" class="mb-12 sm:mb-24 scroll-mt-20 sm:scroll-mt-24">
  <!-- Encabezado -->
  <div class="mb-8 sm:mb-14">
    <h3 class="text-2xl sm:text-4xl font-orbitron font-bold uppercase tracking-[0.06em] text-gradient">
      {{ i18n.t().about.heading }}
    </h3>
    <div class="flex items-center gap-2 mt-3">
      <span class="h-px w-12 bg-emerald-500"></span>
      <span class="w-1.5 h-1.5 bg-emerald-500 rotate-45 animate-pulse-dot"></span>
      <span class="h-px flex-1 bg-emerald-500/10"></span>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row sm:items-center items-start text-left gap-6 sm:gap-10 mb-10">
    <div class="relative flex-shrink-0 group">
      <!-- Foto perfil -->
      <div class="relative p-3 sm:p-4 corner-frame">
        <img
          [src]="photoUrl"
          alt="Alejandro Plata Cortes"
          class="block w-28 h-28 sm:w-44 sm:h-44 object-cover hex-shield
                 saturate-[0.85] transition-[filter] duration-300 group-hover:saturate-100" />
      </div>
    </div>

    <div>
      <h1 class="text-[1.65rem] sm:text-5xl md:text-7xl font-bold mb-4 tracking-[0.03em] text-white font-orbitron text-neon uppercase leading-tight">
        {{ i18n.t().about.titleLine1 }}<br>
        <span class="text-gradient">{{ i18n.t().about.titleLine2 }}</span>
      </h1>
      <h2 class="font-mono text-[11px] sm:text-base uppercase tracking-[0.15em] sm:tracking-[0.2em] text-emerald-400/60">
        // Alejandro Plata Cortes
      </h2>
    </div>
  </div>

  <div class="bg-[#050505] p-4 sm:p-6 corner-frame max-w-3xl">
    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-emerald-500/10">
      <span class="w-2 h-2 rounded-full bg-red-500/50"></span>
      <span class="w-2 h-2 rounded-full bg-amber-500/50"></span>
      <span class="w-2 h-2 rounded-full bg-emerald-500/50"></span>
      <span class="font-mono text-[10px] uppercase tracking-[0.15em] text-zinc-600 ml-2">aboutMe.ts</span>
    </div>
    <!-- Descripción biografía -->
    <div class="space-y-2.5 sm:space-y-3 text-[13px] sm:text-base text-zinc-400 leading-relaxed font-mono">
      @for (parrafo of i18n.t().about.bio; track $index) {
        <p>
          <span class="text-emerald-500/70 mr-1.5 select-none">></span>
          <span [innerHTML]="parrafo"></span>
        </p>
      }
    </div>
  </div>
</section>
